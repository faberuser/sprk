# GitHub Actions builds the shared game/update image; Portainer pulls it from GHCR.
# For local builds, prepare build-input/worker first (docs/linux-battle-worker.md).
# Then build with Dockerfile and use `docker compose up --pull never`.
x-sprk-image: &sprk-image
  image: ${SPRK_IMAGE:-ghcr.io/faberuser/sprk:latest}
  pull_policy: always

services:
  game:
    <<: *sprk-image
    restart: unless-stopped
    init: true
    environment:
      SPRK_SERVICE_MODE: game
      RUST_LOG: ${RUST_LOG:-info,tower_http=debug}
      PORT: "8080"
      GAME_TABLES_PATH: /app/tables
      SERVER_HOST: ${SPRK_GAME_HOST:-127.0.0.1:8080}
      SERVER_HTTPS: ${SPRK_GAME_HTTPS:-false}
      SERVER_NAME: ${SPRK_SERVER_NAME:-SPRK}
      SPRK_GM_KEY: ${SPRK_GM_KEY:-}
      SPRK_GM_BIND: 0.0.0.0:8082
      # Player chat/battle use /ws/chat and /ws/battle on this HTTP service.
      # The image starts its pinned Unity worker under Wine on Linux/amd64.
      # TCP stays private; /health/battle checks worker authentication/capabilities.
      CHAT_BIND: 127.0.0.1
      BATTLE_BIND: 127.0.0.1
      # Game database (docs/database-diagnostics.md). The app role reads and
      # writes data; the owner role applies migrations at startup. Use
      # URL-safe passwords (letters, digits, - and _).
      DATABASE_URL: postgres://sprk_app:${SPRK_DB_APP_PASSWORD:-}@postgres:5432/sprk
      DATABASE_MIGRATION_URL: postgres://sprk_owner:${SPRK_DB_OWNER_PASSWORD:-}@postgres:5432/sprk
      # Connections per pool (main and read pool each). PostgreSQL allows 100
      # in total by default, so keep this at 45 or below.
      SPRK_DB_MAX_CONNECTIONS: ${SPRK_DB_MAX_CONNECTIONS:-16}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SPRK_GAME_PORT:-8080}:8080"
      # Private admin listener. Keep loopback, or choose the Docker host's LAN/VPN IP.
      - "${SPRK_GM_BIND_IP:-127.0.0.1}:${SPRK_GM_PORT:-8082}:8082"
    volumes:
      # Non-database state (native worker configuration).
      - game-data:/data

  updates:
    <<: *sprk-image
    restart: unless-stopped
    init: true
    healthcheck:
      # Startup may download and verify a full client release before listening.
      start_period: 20m
    environment:
      SPRK_SERVICE_MODE: updates
      RUST_LOG: ${RUST_LOG:-info,tower_http=debug}
      PORT: "8080"
      SPRK_UPDATES_DIR: /client-updates
      # The release tag/repository are pinned in the image by CI.
      SPRK_UPDATES_PUBLIC_KEY: ${SPRK_UPDATES_PUBLIC_KEY:-}
    ports:
      - "${SPRK_UPDATE_PORT:-8081}:8080"
    volumes:
      - type: bind
        source: ${SPRK_UPDATES_HOST_DIR:-/srv/sprk/client-updates}
        target: /client-updates
        # Startup sync stages a verified release before switching stable.
        read_only: false
        bind:
          create_host_path: false
    cpus: "${SPRK_UPDATE_CPUS:-1.0}"
    mem_limit: ${SPRK_UPDATE_MEMORY:-256m}

  # Game database. The init script (configs below) creates the roles and the
  # sprk database only when the volume is first created. Back it up with pg_dump; the
  # volume is not a backup (docs/database-diagnostics.md).
  postgres:
    image: postgres:18
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - shared_buffers=${SPRK_DB_SHARED_BUFFERS:-512MB}
      - -c
      - max_wal_size=${SPRK_DB_MAX_WAL_SIZE:-4GB}
      # Commits return before the WAL fsync, like the former SQLite
      # synchronous=NORMAL: a host crash can lose the last ~0.6 s of commits,
      # never corrupts. Set to "on" for strict per-commit durability.
      - -c
      - synchronous_commit=${SPRK_DB_SYNCHRONOUS_COMMIT:-off}
      - -c
      - track_io_timing=on
    environment:
      # Bootstrap superuser, used only by the init script and maintenance.
      POSTGRES_PASSWORD: ${SPRK_DB_SUPERUSER_PASSWORD:-}
      SPRK_DB_OWNER_PASSWORD: ${SPRK_DB_OWNER_PASSWORD:-}
      SPRK_DB_APP_PASSWORD: ${SPRK_DB_APP_PASSWORD:-}
    # Internal Docker network only; no published host port.
    volumes:
      # postgres:18 keeps its data under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
    configs:
      - source: sprk-postgres-init
        target: /docker-entrypoint-initdb.d/10-sprk-roles.sh
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sprk"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Daily pg_dump of the game database into a host directory outside the
  # database volume, keeping the newest SPRK_DB_BACKUP_KEEP. Create the directory
  # first (writable by the postgres image's UID 999).
  postgres-backup:
    image: postgres:18
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/usr/local/bin/sprk-postgres-backup"]
    environment:
      PGHOST: postgres
      PGDATABASE: sprk
      PGUSER: sprk_owner
      PGPASSWORD: ${SPRK_DB_OWNER_PASSWORD:-}
      SPRK_DB_BACKUP_KEEP: ${SPRK_DB_BACKUP_KEEP:-14}
      SPRK_DB_BACKUP_HOUR_UTC: ${SPRK_DB_BACKUP_HOUR_UTC:-4}
      # Off-host copy (e.g. a NAS mounted on the host); empty disables it.
      SPRK_DB_BACKUP_COPY: ${SPRK_DB_BACKUP_COPY_HOST_DIR:-}
      SPRK_DB_BACKUP_COPY_KEEP: ${SPRK_DB_BACKUP_COPY_KEEP:-}
    user: "999:999"
    configs:
      - source: sprk-postgres-backup
        target: /usr/local/bin/sprk-postgres-backup
    volumes:
      - type: bind
        source: ${SPRK_DB_BACKUP_HOST_DIR:-/srv/sprk/db-backups}
        target: /backups
        bind:
          create_host_path: false
      # Without a copy directory this mounts the backup directory a second
      # time, unused. Never created by Docker: a missing NAS mount stops this
      # service instead of filling the local disk.
      - type: bind
        source: ${SPRK_DB_BACKUP_COPY_HOST_DIR:-${SPRK_DB_BACKUP_HOST_DIR:-/srv/sprk/db-backups}}
        target: /backup-copy
        bind:
          create_host_path: false

volumes:
  game-data:
  postgres-data:

# Scripts are inline so the stack needs no files from the repository checkout
# (Portainer git stacks cannot bind-mount relative paths). Compose copies them
# into the containers. Write $$ for a literal $ in them.
configs:
  sprk-postgres-init:
    content: |
      #!/bin/sh
      # Runs once, when the postgres volume is initialized (docker-entrypoint-initdb.d).
      # Creates the sprk database with two roles:
      #   sprk_owner  owns the schema and runs migrations (DATABASE_MIGRATION_URL)
      #   sprk_app    the game's runtime role, data access only (DATABASE_URL)
      # Changing the passwords later is done with ALTER ROLE, not by editing this file.
      : "$${SPRK_DB_OWNER_PASSWORD:?set SPRK_DB_OWNER_PASSWORD}"
      : "$${SPRK_DB_APP_PASSWORD:?set SPRK_DB_APP_PASSWORD}"

      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname postgres \
          -v owner_password="$$SPRK_DB_OWNER_PASSWORD" -v app_password="$$SPRK_DB_APP_PASSWORD" <<'SQL'
      CREATE ROLE sprk_owner LOGIN PASSWORD :'owner_password';
      CREATE ROLE sprk_app LOGIN PASSWORD :'app_password';
      CREATE DATABASE sprk OWNER sprk_owner;
      REVOKE ALL ON DATABASE sprk FROM PUBLIC;
      GRANT CONNECT, TEMPORARY ON DATABASE sprk TO sprk_owner, sprk_app;

      -- A stuck request must not hold locks indefinitely. Stored times are UTC.
      ALTER ROLE sprk_app IN DATABASE sprk SET timezone = 'UTC';
      ALTER ROLE sprk_app IN DATABASE sprk SET statement_timeout = '30s';
      ALTER ROLE sprk_app IN DATABASE sprk SET lock_timeout = '10s';
      ALTER ROLE sprk_app IN DATABASE sprk SET idle_in_transaction_session_timeout = '60s';
      ALTER ROLE sprk_owner IN DATABASE sprk SET timezone = 'UTC';

      \connect sprk
      ALTER SCHEMA public OWNER TO sprk_owner;
      REVOKE CREATE ON SCHEMA public FROM PUBLIC;
      GRANT USAGE ON SCHEMA public TO sprk_app;
      -- Tables and identity sequences created by migrations become usable by the app.
      ALTER DEFAULT PRIVILEGES FOR ROLE sprk_owner IN SCHEMA public
          GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO sprk_app;
      ALTER DEFAULT PRIVILEGES FOR ROLE sprk_owner IN SCHEMA public
          GRANT USAGE, SELECT ON SEQUENCES TO sprk_app;

      -- Query statistics for diagnostics (needs shared_preload_libraries).
      CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
      GRANT pg_read_all_stats TO sprk_owner;
      SQL

  sprk-postgres-backup:
    content: |
      #!/bin/sh
      # Daily logical backups of the game database (docker-compose.yml service
      # postgres-backup). Writes /backups/sprk-<UTC time>.dump (pg_dump custom
      # format) at SPRK_DB_BACKUP_HOUR_UTC and keeps the newest SPRK_DB_BACKUP_KEEP
      # dumps. With SPRK_DB_BACKUP_COPY set, also copies them to /backup-copy (an
      # off-host directory such as a NAS), keeping SPRK_DB_BACKUP_COPY_KEEP there.
      # Restore with pg_restore; see docs/database-diagnostics.md, "Backups and restore".
      set -eu
      : "$${PGHOST:?}" "$${PGUSER:?}" "$${PGPASSWORD:?}" "$${PGDATABASE:?}"
      keep="$${SPRK_DB_BACKUP_KEEP:-14}"
      hour="$${SPRK_DB_BACKUP_HOUR_UTC:-4}"
      copy="$${SPRK_DB_BACKUP_COPY:-}"
      copy_keep="$${SPRK_DB_BACKUP_COPY_KEEP:-$$keep}"
      for n in "$$keep" "$$copy_keep"; do
          case "$$n" in ''|*[!0-9]*|0) echo "SPRK_DB_BACKUP_KEEP and SPRK_DB_BACKUP_COPY_KEEP must be positive numbers" >&2; exit 1 ;; esac
      done

      dumps() { ls -1 "$$1" | grep -E '^sprk-[0-9]{8}T[0-9]{6}Z\.dump$$' | sort -r; }

      # Keep the newest $$2 dumps in directory $$1 (names sort by time).
      prune() {
          dumps "$$1" | tail -n +"$$(($$2 + 1))" | while read -r old; do
              rm -f "$$1/$$old" && echo "Removed old backup: $$1/$$old"
          done
      }

      # Copy every kept dump the copy directory lacks, so a NAS outage catches up
      # on the next run. A failed copy keeps everything and only warns.
      sync_copy() {
          [ -n "$$copy" ] || return 0
          if ! touch /backup-copy/.sprk-write-test 2>/dev/null; then
              echo "Backup copy FAILED: $$copy is not writable by UID $$(id -u)" >&2
              return 0
          fi
          rm -f /backup-copy/.sprk-write-test
          for name in $$(dumps /backups | head -n "$$copy_keep"); do
              [ -e "/backup-copy/$$name" ] && continue
              if cp "/backups/$$name" "/backup-copy/.$$name.partial" && mv "/backup-copy/.$$name.partial" "/backup-copy/$$name"; then
                  echo "Copied to $$copy: $$name"
              else
                  rm -f "/backup-copy/.$$name.partial"
                  echo "Backup copy FAILED: $$name to $$copy" >&2
                  return 0
              fi
          done
          prune /backup-copy "$$copy_keep"
      }

      backup() {
          name="sprk-$$(date -u +%Y%m%dT%H%M%SZ).dump"
          # Write to a temporary name so a failed dump never looks complete.
          if pg_dump --format=custom --no-owner --file="/backups/.$$name.partial"; then
              mv "/backups/.$$name.partial" "/backups/$$name"
              echo "Backup written: $$name ($$(du -h "/backups/$$name" | cut -f1))"
              # Only after a good dump, so a failing backup never deletes good ones.
              prune /backups "$$keep"
          else
              rm -f "/backups/.$$name.partial"
              echo "Backup FAILED; older backups kept" >&2
          fi
          sync_copy
      }

      until pg_isready --quiet; do sleep 5; done
      # Back up at start only when the newest dump is a day old (or missing), so
      # redeploys do not push older daily copies out. Always catch up the copy.
      if [ -z "$$(find /backups -maxdepth 1 -name 'sprk-*.dump' -mmin -1440 2>/dev/null)" ]; then
          backup
      else
          sync_copy
      fi
      while true; do
          # Sleep until the next backup hour (UTC).
          now=$$(date -u +%s)
          next=$$(date -u -d "$$(date -u +%Y-%m-%d) $${hour}:00:00" +%s)
          [ "$$next" -le "$$now" ] && next=$$((next + 86400))
          sleep $$((next - now))
          backup
      done
