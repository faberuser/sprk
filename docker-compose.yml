# GitHub Actions builds the shared game/update image; Portainer pulls it from GHCR.
# For local builds, prepare build-input/worker first (docs/linux-battle-worker.md).
# Then build with Dockerfile and use `docker compose up --pull never`.
x-sprk-image: &sprk-image
  image: ${SPRK_IMAGE:-ghcr.io/faberuser/sprk:latest}
  pull_policy: always

services:
  game:
    <<: *sprk-image
    restart: unless-stopped
    init: true
    environment:
      SPRK_SERVICE_MODE: game
      RUST_LOG: ${RUST_LOG:-info,tower_http=debug}
      PORT: "8080"
      GAME_TABLES_PATH: /app/tables
      SERVER_HOST: ${SPRK_GAME_HOST:-127.0.0.1:8080}
      SERVER_HTTPS: ${SPRK_GAME_HTTPS:-false}
      SERVER_NAME: ${SPRK_SERVER_NAME:-SPRK}
      SPRK_GM_KEY: ${SPRK_GM_KEY:-}
      SPRK_GM_BIND: 0.0.0.0:8082
      # Player chat/battle use /ws/chat and /ws/battle on this HTTP service.
      # The image starts its pinned Unity worker under Wine on Linux/amd64.
      # TCP stays private; /health/battle checks worker authentication/capabilities.
      CHAT_BIND: 127.0.0.1
      BATTLE_BIND: 127.0.0.1
    ports:
      - "${SPRK_GAME_PORT:-8080}:8080"
      # Private admin listener. Keep loopback, or choose the Docker host's LAN/VPN IP.
      - "${SPRK_GM_BIND_IP:-127.0.0.1}:${SPRK_GM_PORT:-8082}:8082"
    volumes:
      - game-data:/data

  updates:
    <<: *sprk-image
    restart: unless-stopped
    init: true
    healthcheck:
      # Startup may download and verify a full client release before listening.
      start_period: 20m
    environment:
      SPRK_SERVICE_MODE: updates
      RUST_LOG: ${RUST_LOG:-info,tower_http=debug}
      PORT: "8080"
      SPRK_UPDATES_DIR: /client-updates
      # The release tag/repository are pinned in the image by CI.
      SPRK_UPDATES_PUBLIC_KEY: ${SPRK_UPDATES_PUBLIC_KEY:-}
    ports:
      - "${SPRK_UPDATE_PORT:-8081}:8080"
    volumes:
      - type: bind
        source: ${SPRK_UPDATES_HOST_DIR:-/srv/sprk/client-updates}
        target: /client-updates
        # Startup sync stages a verified release before switching stable.
        read_only: false
        bind:
          create_host_path: false
    cpus: "${SPRK_UPDATE_CPUS:-1.0}"
    mem_limit: ${SPRK_UPDATE_MEMORY:-256m}

  # PostgreSQL for the SQLite migration (docs/postgresql-migration.md). Behind
  # a profile until the cutover: the game still uses sprk.db, and a plain
  # `docker compose up` does not start this service. Start it with
  # `docker compose --profile postgres up -d postgres`. The init script runs
  # only when the volume is first created.
  postgres:
    image: postgres:18
    profiles: [postgres]
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - shared_buffers=${SPRK_DB_SHARED_BUFFERS:-512MB}
      - -c
      - max_wal_size=${SPRK_DB_MAX_WAL_SIZE:-4GB}
    environment:
      # Bootstrap superuser, used only by the init script and maintenance.
      POSTGRES_PASSWORD: ${SPRK_DB_SUPERUSER_PASSWORD:-}
      SPRK_DB_OWNER_PASSWORD: ${SPRK_DB_OWNER_PASSWORD:-}
      SPRK_DB_APP_PASSWORD: ${SPRK_DB_APP_PASSWORD:-}
    # Internal Docker network only; no published host port.
    volumes:
      # postgres:18 keeps its data under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
      - ./config/postgres/initdb:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sprk"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  game-data:
  postgres-data:
