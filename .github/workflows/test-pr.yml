name: Test pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sprk-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test server
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # PostgreSQL schema, trigger parity and locking tests (src/postgres_tests.rs).
    # Each test creates and drops its own database on this server.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRK_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup override set 1.99.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo +1.99.1 test --locked

      - name: Type-check SQL against the PostgreSQL schema
        run: python3 -I scripts/server/check_sql.py --psql "docker exec -i ${{ job.services.postgres.id }} psql -U postgres"

      - name: Test client release packaging
        run: python3 -m unittest discover -s scripts -t . -p 'test_*client*.py'

  client-release:
    name: Build and verify client release
    # Runs the same patch/verify/package path as the main-branch release, so
    # DllPatcher failures show up on the PR instead of during deployment.
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Skip when client inputs match the latest release
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, os.environ['GITHUB_WORKSPACE'])
          from scripts.release.client_release_inputs import main
          main()

      - name: Set up Python
        if: steps.reuse.outputs.tag == ''
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/client/requirements-client.txt

      - name: Set up .NET
        if: steps.reuse.outputs.tag == ''
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        if: steps.reuse.outputs.tag == ''
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('scripts/DllPatcher/*.csproj', '**/Directory.Packages.props', '**/NuGet.Config', '**/nuget.config') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Install client patch dependencies
        if: steps.reuse.outputs.tag == ''
        run: python -m pip install -r scripts/client/requirements-client.txt

      - name: Build and verify client release (throwaway signature, no publish)
        if: steps.reuse.outputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "pr-$($env:GITHUB_SHA.Substring(0,12))-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          python scripts/release/build_client_release.py `
            --work "$env:RUNNER_TEMP/client-build" `
            --version $version --repo $env:GITHUB_REPOSITORY --check-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  native-tests:
    name: Test native battles under Wine
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The tests run in a container on the host network and use this server.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select latest published client for PR compatibility tests
        id: client
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release/latest_client_release.py

      - name: Assemble verified Linux battle worker
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_TAG: ${{ steps.client.outputs.tag }}
        run: python3 scripts/server/linux_worker.py build --repo "$GITHUB_REPOSITORY" --tag "$CLIENT_TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build native combat integration test image
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          targets: native-tests
          load: true
          push: false
          set: |
            server-test-deps.cache-from=type=gha,scope=sprk-native-test-deps
            server-test-deps.cache-to=type=gha,scope=sprk-native-test-deps,mode=max
            server-runtime.cache-from=type=gha,scope=sprk-native-runtime
            server-runtime.cache-to=type=gha,scope=sprk-native-runtime,mode=max
            native-tests.cache-from=type=gha,scope=sprk-native-tests
            native-tests.cache-to=type=gha,scope=sprk-native-tests,mode=max

      - name: Run worker tests under Wine
        run: |
          db="SPRK_TEST_POSTGRES_URL=postgres://postgres:postgres@127.0.0.1:5432/postgres"
          docker run --rm --init --network host --env "$db" sprk-native-tests:ci conquest_native_tcp_battle --ignored --nocapture
          docker run --rm --init --network host --env "$db" sprk-native-tests:ci native_challenge_party_combat_and_settlement --ignored --nocapture

  server-image:
    name: Build and smoke-test server image
    # Same release compile, image and readiness check as build-and-deploy.yml,
    # without pushing or deploying. Runs alongside the Wine tests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select latest published client for PR compatibility tests
        id: client
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release/latest_client_release.py

      - name: Assemble verified Linux battle worker
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_TAG: ${{ steps.client.outputs.tag }}
        run: python3 scripts/server/linux_worker.py build --repo "$GITHUB_REPOSITORY" --tag "$CLIENT_TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compile Linux server binary
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: server-binary
          platforms: linux/amd64
          outputs: type=local,dest=build-input/server
          cache-from: type=gha,scope=sprk-server-build

      - name: Build server image for validation
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: precompiled-production
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            CLIENT_UPDATE_REPO=${{ github.repository }}
            CLIENT_UPDATE_TAG=${{ steps.client.outputs.tag }}
          tags: sprk-server:pr-${{ github.sha }}
          cache-from: type=gha,scope=sprk-server

      - name: Require Linux battle worker readiness
        run: python3 scripts/server/smoke_linux_worker.py "sprk-server:pr-${GITHUB_SHA}"

