name: Build and deploy server

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      client_release_tag:
        description: "Reuse a compatible client-<version> release; blank reuses unchanged client inputs or builds a new release"
        type: string
        required: false
      force_client_build:
        description: "Rebuild the client even when its signed input fingerprint matches"
        type: boolean
        default: false

permissions:
  contents: read

# Finish a deployment before another run can replace its latest tag.
concurrency:
  group: sprk-server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  client-release:
    name: Build and publish client update
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20
    environment: client-release
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.reuse.outputs.tag || steps.build.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select an existing release override
        id: reuse
        env:
          INPUT_TAG: ${{ inputs.client_release_tag }}
          FORCE_CLIENT_BUILD: ${{ inputs.force_client_build || false }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, os.environ['GITHUB_WORKSPACE'])
          from client.scripts.release.client_release_inputs import main
          main()

      - name: Set up Python
        if: steps.reuse.outputs.tag == ''
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up .NET
        if: steps.reuse.outputs.tag == ''
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: client/global.json

      - name: Cache NuGet packages
        if: steps.reuse.outputs.tag == ''
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('client/global.json', 'client/managed/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Build, verify, sign and publish client release
        id: build
        if: steps.reuse.outputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_UPDATE_SIGNING_KEY: ${{ secrets.CLIENT_UPDATE_SIGNING_KEY }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: pwsh
        run: |
          $version = "ci-$($env:GITHUB_SHA.Substring(0,12))-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          python client/scripts/release/build_client_release.py `
            --work "$env:RUNNER_TEMP/client-build" `
            --version $version --repo $env:RELEASE_REPOSITORY --publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  compile-server:
    name: Compile server
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.binary.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compile Linux server binary
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: server-binary
          platforms: linux/amd64
          outputs: type=local,dest=build-input/server
          cache-from: type=gha,scope=sprk-server-build
          cache-to: type=gha,scope=sprk-server-build,mode=max

      - name: Upload server binary
        id: binary
        uses: actions/upload-artifact@v4
        with:
          name: sprk-server-${{ github.sha }}
          path: build-input/server/sprk-server
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  build-and-deploy:
    name: Publish image and update Portainer
    needs: [client-release, compile-server]
    # Pull requests and manual runs on other branches cannot deploy.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download server binary from this run
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.compile-server.outputs.artifact-id }}
          merge-multiple: true
          path: build-input/server

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Assemble verified Linux battle worker
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_TAG: ${{ needs.client-release.outputs.tag }}
        run: python3 server/scripts/worker/linux_worker.py build --repo "$GITHUB_REPOSITORY" --tag "$CLIENT_TAG"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for validation
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: precompiled-production
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            CLIENT_UPDATE_REPO=${{ github.repository }}
            CLIENT_UPDATE_TAG=${{ needs.client-release.outputs.tag }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=sprk-server
          cache-to: type=gha,scope=sprk-server,mode=max

      - name: Require Linux battle worker readiness before publishing
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: python3 server/scripts/worker/smoke_linux_worker.py "${IMAGE}:sha-${GITHUB_SHA}"

      - name: Push validated image
        id: push
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker push "${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:sha-${GITHUB_SHA}")" >> "$GITHUB_OUTPUT"

      - name: Record published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
          CLIENT_TAG: ${{ needs.client-release.outputs.tag }}
        run: |
          echo "Published ${IMAGE}:latest and ${IMAGE}:sha-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Image digest: ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pinned client release: ${CLIENT_TAG:-none (automatic client sync disabled)}" >> "$GITHUB_STEP_SUMMARY"

      - name: Update Portainer stack
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PORTAINER_WEBHOOK_URL" ]]; then
            echo "::error::Set the PORTAINER_WEBHOOK_URL repository Actions secret. The image was published, but deployment was not triggered."
            exit 1
          fi
          # Do not retry a POST that may already have started a deployment.
          # Suppress response bodies and curl errors that could expose the URL.
          if ! status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --connect-timeout 15 --max-time 120 \
            "$PORTAINER_WEBHOOK_URL"); then
            echo "::error::Could not reach the Portainer webhook, or the request timed out. Check Portainer before retrying."
            exit 1
          fi
          if [[ "$status" != 2?? ]]; then
            echo "::error::Portainer webhook returned HTTP ${status}; expected 2xx."
            exit 1
          fi
          echo "Portainer accepted the deployment request (HTTP ${status}). Check stack health in Portainer." >> "$GITHUB_STEP_SUMMARY"
