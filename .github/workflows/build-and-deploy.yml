name: Build and deploy server

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      client_release_tag:
        description: "Reuse a compatible client-<version> release; blank builds a new client release from this commit"
        type: string
        required: false

permissions:
  contents: read

# Finish a deployment before another run can replace its latest tag.
concurrency:
  group: sprk-server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test server
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install 1.93.0 --profile minimal

      - name: Test
        run: cargo +1.93.0 test --locked

      - name: Test client release packaging
        run: python3 -m unittest discover -s scripts -p 'test_*client*.py'

  client-release:
    name: Build and publish client update
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    environment: client-release
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.reuse.outputs.tag || steps.build.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install client patch dependencies
        run: python -m pip install -r scripts/requirements-client.txt

      - name: Select an existing release override
        id: reuse
        env:
          INPUT_TAG: ${{ inputs.client_release_tag }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: python
        run: |
          import json, os, re, subprocess, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from client_update_bundle import verified_manifest
          tag = os.environ.get('INPUT_TAG', '')
          if tag and (len(tag) > 128 or not re.fullmatch(r'client-[A-Za-z0-9][A-Za-z0-9_.-]*', tag)):
              raise SystemExit('Expected a client-<version> release tag')
          if tag:
              repo = os.environ['RELEASE_REPOSITORY']
              release = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/tags/{tag}']))
              assets = {asset['name'] for asset in release['assets'] if asset['state'] == 'uploaded'}
              if release['draft'] or release['prerelease'] or not {'client-update-manifest.json', 'client-update.tar.gz'} <= assets:
                  raise SystemExit('Expected a complete published client release')
              with tempfile.TemporaryDirectory() as folder:
                  subprocess.run(['gh', 'release', 'download', tag, '--repo', repo, '--pattern', 'client-update-manifest.json', '--dir', folder], check=True)
                  manifest = verified_manifest((Path(folder) / 'client-update-manifest.json').read_bytes(), Path('config/client-update-public.pem'))
                  if tag != 'client-' + manifest['version']:
                      raise SystemExit('Tag differs from the signed manifest version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\n')

      - name: Build, verify, sign and publish client release
        id: build
        if: steps.reuse.outputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_UPDATE_SIGNING_KEY: ${{ secrets.CLIENT_UPDATE_SIGNING_KEY }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: pwsh
        run: |
          $version = "ci-$($env:GITHUB_SHA.Substring(0,12))-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          python scripts/build_client_release.py `
            --work "$env:RUNNER_TEMP/client-build" `
            --version $version --repo $env:RELEASE_REPOSITORY --publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build-and-deploy:
    name: Publish image and update Portainer
    needs: client-release
    # Pull requests and manual runs on other branches cannot deploy.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Assemble verified Linux battle worker
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_TAG: ${{ needs.client-release.outputs.tag }}
        run: python3 scripts/linux_worker.py build --repo "$GITHUB_REPOSITORY" --tag "$CLIENT_TAG"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for validation
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            CLIENT_UPDATE_REPO=${{ github.repository }}
            CLIENT_UPDATE_TAG=${{ needs.client-release.outputs.tag }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=sprk-server
          cache-to: type=gha,scope=sprk-server,mode=max

      - name: Require Linux battle worker readiness before publishing
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: python3 scripts/smoke_linux_worker.py "${IMAGE}:sha-${GITHUB_SHA}"

      - name: Build native combat integration image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: native-tests
          platforms: linux/amd64
          load: true
          push: false
          tags: sprk-native-tests:ci
          build-args: |
            CLIENT_UPDATE_REPO=${{ github.repository }}
            CLIENT_UPDATE_TAG=${{ needs.client-release.outputs.tag }}
          cache-from: type=gha,scope=sprk-server
          cache-to: type=gha,scope=sprk-server,mode=max

      - name: Run Challenge Raid and Guild Conquest under Wine
        run: |
          docker run --rm --init sprk-native-tests:ci readiness_requires_live_worker_and_supported_capabilities --nocapture
          docker run --rm --init sprk-native-tests:ci conquest_native_tcp_battle --ignored --nocapture
          docker run --rm --init sprk-native-tests:ci native_challenge_party_combat_and_settlement --ignored --nocapture

      - name: Push validated image
        id: push
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker push "${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:sha-${GITHUB_SHA}")" >> "$GITHUB_OUTPUT"

      - name: Record published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
          CLIENT_TAG: ${{ needs.client-release.outputs.tag }}
        run: |
          echo "Published ${IMAGE}:latest and ${IMAGE}:sha-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Image digest: ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pinned client release: ${CLIENT_TAG:-none (automatic client sync disabled)}" >> "$GITHUB_STEP_SUMMARY"

      - name: Update Portainer stack
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PORTAINER_WEBHOOK_URL" ]]; then
            echo "::error::Set the PORTAINER_WEBHOOK_URL repository Actions secret. The image was published, but deployment was not triggered."
            exit 1
          fi
          # Do not retry a POST that may already have started a deployment.
          # Suppress response bodies and curl errors that could expose the URL.
          if ! status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --connect-timeout 15 --max-time 120 \
            "$PORTAINER_WEBHOOK_URL"); then
            echo "::error::Could not reach the Portainer webhook, or the request timed out. Check Portainer before retrying."
            exit 1
          fi
          if [[ "$status" != 2?? ]]; then
            echo "::error::Portainer webhook returned HTTP ${status}; expected 2xx."
            exit 1
          fi
          echo "Portainer accepted the deployment request (HTTP ${status}). Check stack health in Portainer." >> "$GITHUB_STEP_SUMMARY"
