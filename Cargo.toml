[package]
name = "sprk-server"
version = "0.1.0"
edition = "2021"
description = "Private compatibility server for sprk"
authors = ["Private Server Project"]

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "form"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono"] }

# Cryptography (AES-128 for request/response encryption)
aes = "0.8"
cbc = "0.1"
base64 = "0.21"
hex = "0.4"
rand = "0.8"

# Compression
flate2 = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
once_cell = "1.19"
parking_lot = "0.12"
dashmap = "5.5"
urlencoding = "2.1.3"

[profile.release]
opt-level = 3
lto = true
