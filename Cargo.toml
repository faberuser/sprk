[package]
name = "sprk-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Private compatibility server for sprk"
authors = ["Private Server Project"]

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros", "form", "ws"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip", "fs"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"

# Database
# "postgres" is for the PostgreSQL port (docs/postgresql-migration.md); the
# server still runs on SQLite until the cutover.
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "postgres", "chrono"] }

# Cryptography
base64 = "0.23"
hex = "0.4"
rand = "0.10"
argon2 = "0.6"
sha2 = "0.11"

# Compression
flate2 = "1.0"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
tar = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"
once_cell = "1.19"
dashmap = "6.2"
# Allocator: faster small allocations and less fragmentation for the JSON-heavy
# request path than the system allocator (glibc malloc / Windows heap).
mimalloc = { version = "0.1", default-features = false }
urlencoding = "2.1.3"

[dev-dependencies]
tokio-tungstenite = "0.30"

[profile.release]
opt-level = 3
lto = true
